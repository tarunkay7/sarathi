services:
  - type: web
    # Must match the service that actually exists, otherwise re-syncing this
    # blueprint creates a second one instead of updating setu-sarathi.
    name: setu-sarathi
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:migrate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_STATIC_KEY
        sync: false
      - key: PDF_SERVICES_CLIENT_ID
        sync: false
      - key: PDF_SERVICES_CLIENT_SECRET
        sync: false
